[build-system]
requires = ["hatchling>=1.27,<2", "mlx==0.32.4", "nanobind==3.1.0"]
build-backend = "hatchling.build"

[project]
name = "rec-mlx"
version = "0.1.0"
description = "Flint inference engine for Apple Silicon"
requires-python = ">=3.12"
dependencies = [
    "mlx==0.32.4",
    "mlx-lm==0.31.3",
    "transformers==5.16.1",
    "xgrammar==0.2.1",
]

[project.optional-dependencies]
validation = ["pytest==8.4.2"]

[project.scripts]
rec-mlx = "rec_mlx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rec_mlx"]

[tool.ruff]
extend = "../ruff.toml"
extend-exclude = ["src/rec_mlx/kernels"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "native", "tests", "hatch_build.py", "pyproject.toml"]
